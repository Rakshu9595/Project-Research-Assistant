<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Research Assistant</title>
  <meta name="description" content="Sign in to your AI Research Assistant workspace to access document-grounded research and academic papers.">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <span class="brand-title">Research<span style="color: var(--primary);">AI</span></span>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your intelligent research workspace</p>
      </div>

      <!-- Alert Container -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="emailInput" class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="emailInput" placeholder="name@university.edu" required autocomplete="email">
          </div>
          <div class="invalid-feedback" id="emailError">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="passwordInput" class="form-label mb-0">Password</label>
            <a href="#" class="small text-muted" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</a>
          </div>
          <div class="input-group password-input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control pe-5" id="passwordInput" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="passwordError">Please enter your password.</div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMeCheck">
          <label class="form-check-label small text-muted" for="rememberMeCheck">
            Keep me signed in on this device
          </label>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <div class="auth-footer-text">
        Don't have an account? <a href="register.html">Create an account</a>
      </div>
    </div>
  </main>

  <!-- Forgot Password Placeholder Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="forgotPasswordModalLabel"><i class="bi bi-key me-2 text-primary"></i>Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">
            Enter your email address and we'll send you instructions to reset your password.
          </p>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="name@university.edu" id="resetEmailInput">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="handlePasswordReset()">Send Reset Link</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, go to dashboard
      Auth.requireGuest();

      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const alertEl = document.getElementById('authAlert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertEl.classList.add('d-none');

        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        // Simple validation
        let valid = true;
        if (!email || !email.includes('@')) {
          document.getElementById('emailInput').classList.add('is-invalid');
          valid = false;
        } else {
          document.getElementById('emailInput').classList.remove('is-invalid');
        }

        if (!password) {
          document.getElementById('passwordInput').classList.add('is-invalid');
          valid = false;
        } else {
          document.getElementById('passwordInput').classList.remove('is-invalid');
        }

        if (!valid) return;

        Utils.setButtonLoading(submitBtn, true);

        try {
          await Auth.login(email, password);
          Utils.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } catch (err) {
          alertEl.textContent = err.message || 'Invalid credentials. Please verify your email and password.';
          alertEl.classList.remove('d-none');
          Utils.setButtonLoading(submitBtn, false, '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In');
        }
      });
    });

    function handlePasswordReset() {
      const email = document.getElementById('resetEmailInput').value.trim();
      if (!email || !email.includes('@')) {
        Utils.showToast('Please enter a valid email address.', 'warning');
        return;
      }
      const modalEl = document.getElementById('forgotPasswordModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
      Utils.showToast('Password reset link sent if account exists.', 'info');
    }
  </script>
</body>
</html>
