<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI Research Assistant</title>
  <meta name="description" content="Create a free AI Research Assistant account to start analyzing project reports and discovering research literature.">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <span class="brand-title">Research<span style="color: var(--primary);">AI</span></span>
        </a>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join researchers analyzing technical documentation</p>
      </div>

      <!-- Alert Container -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="nameInput" class="form-label">Full name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="nameInput" placeholder="Dr. Alex Rivera" required autocomplete="name">
          </div>
          <div class="invalid-feedback" id="nameError">Please enter your full name.</div>
        </div>

        <div class="mb-3">
          <label for="emailInput" class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="emailInput" placeholder="name@university.edu" required autocomplete="email">
          </div>
          <div class="invalid-feedback" id="emailError">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-group password-input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control pe-5" id="passwordInput" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <!-- Password strength bar -->
          <div class="password-strength-container mt-2">
            <div class="strength-bar-wrapper">
              <div id="strengthBar" class="strength-bar"></div>
            </div>
            <span id="strengthText" class="strength-text">Password strength</span>
          </div>
          <div class="invalid-feedback" id="passwordError">Password must be at least 6 characters.</div>
        </div>

        <div class="mb-4">
          <label for="confirmPasswordInput" class="form-label">Confirm password</label>
          <div class="input-group password-input-group">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control pe-5" id="confirmPasswordInput" placeholder="Re-enter your password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="confirmError">Passwords do not match.</div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary w-100 py-2">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>
      </form>

      <div class="auth-footer-text">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireGuest();

      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('registerSubmitBtn');
      const alertEl = document.getElementById('authAlert');
      const passwordInput = document.getElementById('passwordInput');
      const confirmInput = document.getElementById('confirmPasswordInput');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');

      // Live Password Strength Check
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        if (!val) {
          strengthBar.className = 'strength-bar';
          strengthText.textContent = 'Password strength';
          return;
        }

        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        if (score <= 1) {
          strengthBar.className = 'strength-bar weak';
          strengthText.textContent = 'Weak password';
          strengthText.style.color = 'var(--danger)';
        } else if (score <= 2) {
          strengthBar.className = 'strength-bar medium';
          strengthText.textContent = 'Medium password';
          strengthText.style.color = 'var(--warning)';
        } else {
          strengthBar.className = 'strength-bar strong';
          strengthText.textContent = 'Strong password';
          strengthText.style.color = 'var(--success)';
        }
      });

      // Submit Form
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertEl.classList.add('d-none');

        const name = document.getElementById('nameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        let valid = true;

        if (!name) {
          document.getElementById('nameInput').classList.add('is-invalid');
          valid = false;
        } else {
          document.getElementById('nameInput').classList.remove('is-invalid');
        }

        if (!email || !email.includes('@')) {
          document.getElementById('emailInput').classList.add('is-invalid');
          valid = false;
        } else {
          document.getElementById('emailInput').classList.remove('is-invalid');
        }

        if (!password || password.length < 6) {
          passwordInput.classList.add('is-invalid');
          valid = false;
        } else {
          passwordInput.classList.remove('is-invalid');
        }

        if (password !== confirmPassword) {
          confirmInput.classList.add('is-invalid');
          valid = false;
        } else {
          confirmInput.classList.remove('is-invalid');
        }

        if (!valid) return;

        Utils.setButtonLoading(submitBtn, true);

        try {
          await Auth.register(name, email, password);
          Utils.showToast('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        } catch (err) {
          alertEl.textContent = err.message || 'Registration failed. Please try again.';
          alertEl.classList.remove('d-none');
          Utils.setButtonLoading(submitBtn, false, '<i class="bi bi-person-plus me-1"></i> Create Account');
        }
      });
    });
  </script>
</body>
</html>
